[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.30"
via_ir = true
optimizer = true
optimizer_runs = 200
# Somnia CREATE costs ~25–55M gas/contract; multiplier helps forge script dry-runs only.
gas_estimate_multiplier = 300

[rpc_endpoints]
somnia_testnet = "https://api.infra.testnet.somnia.network/"

[etherscan]
somnia_testnet = { key = "placeholder", url = "https://shannon-explorer.somnia.network/api/", chain = 50312 }
